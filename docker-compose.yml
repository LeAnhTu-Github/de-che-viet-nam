# Dev: game server + redis local (khi deploy dùng Upstash thay redis local)
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "2567:2567"
    environment:
      - PORT=2567
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
